import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import javax.inject.Inject

// Declared before the `tasks.register` that uses it: Groovy resolves a class
// defined in a build script at the point it is referenced, so it cannot be
// hoisted out of this order.
abstract class VerifyVersionCode extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    // @Internal, not @Input: these are constants of the build script, not
    // something a caller varies per invocation. Declaring them as inputs would
    // let the configuration cache key on them, which is harmless but would
    // imply they are meant to be overridden.
    @Internal
    abstract Property<Integer> getDeclaredVersionCode()

    @Internal
    abstract Property<String> getDeclaredVersionName()

    // Where git runs. Set to the Gradle root rather than the repository root,
    // because the two are not the same directory: the Gradle root is
    // com.smccloud.hotdeath/ and the repository root is its parent.
    @Internal
    abstract DirectoryProperty getGitWorkingDir()

    @TaskAction
    void verify() {
        def declaredCode = declaredVersionCode.get()
        def declaredName = declaredVersionName.get()
        def workingDir = gitWorkingDir.get().asFile

        def published = [:]
        def tagList = gitOutput(['tag', '--list', 'v*'], workingDir)
        if (tagList == null) {
            logger.lifecycle('verifyVersionCode: not a git checkout with tags; nothing to ' +
                'compare against. Not an error.')
            return
        }

        // `git show <tag>:<path>` resolves the path against the repository root,
        // not against the Gradle root, so ask git where it thinks we are rather
        // than hardcoding a directory name.
        def prefix = gitOutput(['rev-parse', '--show-prefix'], workingDir)
        if (prefix == null) {
            logger.lifecycle('verifyVersionCode: cannot locate the repository root; ' +
                'nothing to compare against. Not an error.')
            return
        }
        def buildGradleInRepo = prefix + 'app/build.gradle'

        // One tag per line, blanks dropped. `git tag --list` newline-separates,
        // and iterating the raw string instead of a list of lines walks it
        // character by character -- which is a silent way to run `git show v:...`
        // once per letter of "v1.4.5".
        def tagNames = tagList.readLines().findAll { it.trim() }

        // A plain for loop rather than tagNames.each {}. Inside a closure the
        // method lookup for a private method on a Gradle-decorated task class
        // does not resolve, and `return` inside a closure returns from the
        // closure anyway, which is a different thing from what `continue` means
        // here. The loop says both of those things plainly.
        for (String tagName : tagNames) {
            def text = gitOutput(['show', "${tagName}:${buildGradleInRepo}"], workingDir)
            if (text == null) {
                logger.info("verifyVersionCode: no ${buildGradleInRepo} at ${tagName}, skipping")
                continue
            }
            // Find the version a tag declares, which is one of two shapes. Tags up to
            // v1.4.5 wrote `versionName "1.4.5"` directly; from v1.4.6 the
            // literal moved up to `def appVersion = '1.4.6'` and the line inside
            // defaultConfig reads `versionName appVersion`. Matching only the
            // first shape would make this task skip v1.4.6 and every tag after
            // it -- so it would compare against v1.4.5 forever and never notice
            // a release that reused a versionCode. Both are anchored on the whole
            // trimmed line, so a version quoted inside a comment does not match.
            def found = null
            for (String line : text.readLines()) {
                def matcher = line.trim() =~
                    /^(?:versionName\s+"|def\s+appVersion\s*=\s*['"])(\d+)\.(\d+)\.(\d+)['"]?$/
                if (matcher.matches()) {
                    found = matcher
                    break
                }
            }
            if (found == null) {
                logger.info("verifyVersionCode: no declared version at ${tagName}, skipping")
                continue
            }
            def name = "${found.group(1)}.${found.group(2)}.${found.group(3)}"
            def code = (found.group(1) as int) * 1000000 +
                (found.group(2) as int) * 1000 + (found.group(3) as int)
            published[tagName] = [name: name, code: code]
        }

        if (published.isEmpty()) {
            logger.lifecycle('verifyVersionCode: no published v* tags found; nothing to ' +
                'compare against. Expected in a clone without tags. Not an error.')
            return
        }

        // A tag pointing at the commit being built is this release being tagged
        // now, not a published version it has to beat. Comparing against it would
        // make the release commit fail its own gate: v1.4.6 tagged on the commit
        // that declares 1.4.6 is 1004006 against 1004006, and every tag after
        // this would go red the moment it was cut. So a tag on HEAD is the
        // release in progress and is excluded from the baseline. What remains is
        // everything actually published before it, which is what the check is for.
        String head = gitOutput(['rev-parse', 'HEAD'], workingDir)
        def baseline = [:]
        for (def entry : published.entrySet()) {
            def tagCommit = gitOutput(['rev-list', '-n', '1', entry.key], workingDir)
            if (head != null && tagCommit != null && tagCommit == head) {
                logger.lifecycle("verifyVersionCode: ${entry.key} points at HEAD " +
                    "(${entry.value.name}), treating it as this release being tagged.")
                continue
            }
            baseline[entry.key] = entry.value
        }

        if (baseline.isEmpty()) {
            logger.lifecycle('verifyVersionCode: every v* tag points at HEAD, so nothing ' +
                'has been published yet. Nothing to compare against. Not an error.')
            return
        }

        // Highest by the same encoding versionCode uses, so this is the ordering
        // Android sees. Comparing the tag names instead would put v1.3.167 after
        // v1.4.0, which is not what any version of the app believes.
        String highestTag = null
        def highest = null
        for (def entry : baseline.entrySet()) {
            if (highest == null || entry.value.code > highest.code) {
                highestTag = entry.key
                highest = entry.value
            }
        }

        // Going backwards is the bug this exists to catch: it cannot install at
        // all, and nobody can fix it by signing differently. Failing hard.
        if (declaredCode < highest.code) {
            throw new GradleException(
                "versionCode ${declaredCode} (${declaredName}) is lower than " +
                "${highest.code} (${highestTag}, ${highest.name}).\n" +
                "Android refuses to install a build whose versionCode is not higher than the " +
                'one already installed, so this artifact can never be installed.\n' +
                'Bump the minor or the patch in appVersion near the top of this file.')
        }

        // Equal is normal and is only a problem at the moment of publishing, so
        // it is reported rather than enforced. Every commit after a release sits
        // here until someone bumps the patch -- a README fix, a log message, an
        // empty commit -- and failing those would leave main permanently red and
        // teach people to ignore this task, which is how the original problem
        // went unnoticed in the first place. A tag on HEAD is handled above and
        // never reaches here, so this line means "working past an untagged
        // release". The bump before tagging is the human's half of the check.
        if (declaredCode == highest.code) {
            logger.lifecycle("verifyVersionCode: ${declaredCode} (${declaredName}) == " +
                "${highest.code} (${highestTag}, ${highest.name}). OK for development, but a " +
                "build of this version will not install over ${highestTag}, so bump the patch " +
                "in appVersion before tagging it.")
            return
        }

        logger.lifecycle("verifyVersionCode: ${declaredCode} (${declaredName}) > " +
            "${highest.code} (${highestTag}, ${highest.name}). OK.")
    }

    // Returns stdout, or null when the command fails. Callers treat null as
    // "not available here", which is the right reading for every command here.
    // ExecOperations rather than `['git', ...].execute()`. The configuration
    // cache is on, and it treats a bare external process as an undeclared
    // input: the build fails with "external process started 'git ...'" even
    // though the command is constant. The injected service is what makes this
    // task configuration-cache clean.
    //
    // Not named `git`: this project has a task called git, and a method of the
    // same name on a task is shadowed by the task rather than winning.
    private String gitOutput(List<String> args, File workingDir) {
        // Both streams are captured rather than left inheriting the console.
        // stderr in particular is noise on failure -- `git show` on a tag that
        // predates app/build.gradle writes "path does not exist" -- and letting
        // it through would print that for every skipped tag.
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = execOperations.exec { spec ->
            spec.commandLine(['git'] + args)
            spec.workingDir(workingDir)
            spec.standardOutput = stdout
            spec.errorOutput = stderr
            // Required, not optional. exec() throws on a non-zero exit by
            // default, and a non-zero exit is the normal answer here: `git show`
            // against a tag that predates app/build.gradle, or any command in a
            // directory that is not a checkout at all. Treat those as "nothing
            // to read" rather than as build failures.
            spec.ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            logger.info("verifyVersionCode: git ${args.join(' ')} exited ${result.exitValue}")
            return null
        }
        return stdout.toString('UTF-8').trim()
    }
}

// Release signing material, read from keystore.properties beside this file when
// it exists. That file is gitignored and holds the four secrets, so nothing
// about the key lives in git. Without it the release variant falls back to the
// debug key, which keeps a fresh clone buildable and keeps CI's release stage
// from failing for anyone who has not set one up.
def keystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Versioning: MAJOR.MINOR.PATCH, and the patch is a plain release counter
// within the minor line. Nothing derives it from anything else -- 1.4.6 is the
// seventh release of the 1.4 line, and 1.5.0 is the next line rather than the
// seven hundredth patch of this one.
//
// versionCode is computed from versionName below so the two cannot disagree:
// major*1000000 + minor*1000 + patch. That is the encoding every published
// version already uses, so no versionCode ever has to change retroactively --
// 1.4.5 is still 1004005 and this release is 1.4.6 / 1004006.
//
// The one hard constraint: Android refuses to install a build whose versionCode
// is not strictly greater than the one already installed, and refuses to
// replace a build signed with a different key at the same versionCode. So
// versionCode must increase on every release even when nothing else did.
// `gradle verifyVersionCode` compares against the highest existing tag, and the
// Jenkinsfile runs it before the release build; the check used to be
// documentation and is now a gate. It fails only when the versionCode has gone
// backwards, and warns when it merely matches the last release -- which is the
// state of every commit between two releases. Bumping the patch before tagging
// is the part the task cannot do for you.
//
// The patch has three digits, so it runs out at 999. Bump the minor and reset
// the patch to 0 when it gets close. The minor has three digits too, for the
// same reason.
//
// Release history is in CHANGELOG.txt, not here. It used to be a 70-line
// comment in this file, which is the wrong place for it: it could only ever be
// as current as the last person to remember to update it, and by 1.4.5 it was
// describing a test-count scheme that had been abandoned at 1.4.0 and had never
// matched the real counts anyway. See #12.
def appVersion = '1.4.6'

def appVersionParts = appVersion.tokenize('.')
if (appVersionParts.size() != 3 || !appVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException(
        "versionName must be MAJOR.MINOR.PATCH with three numeric parts, got '${appVersion}'")
}
def major = appVersionParts[0] as int
def minor = appVersionParts[1] as int
def patch = appVersionParts[2] as int
if (minor > 999) {
    throw new GradleException(
        "Minor ${minor} needs four digits but versionCode encodes it in three. " +
        "There is no encoding left for that line; pick a different scheme.")
}
if (patch > 999) {
    throw new GradleException(
        "Patch ${patch} does not fit in the three digits versionCode gives it, and " +
        "patch ${patch + 1} would collide with the next minor. Bump the minor and " +
        "reset the patch to 0 -- 1.${minor + 1}.0.")
}
def computedVersionCode = major * 1000000 + minor * 1000 + patch

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    namespace 'com.smccloud.hotdeath'

    compileSdk 36

    defaultConfig {

        applicationId 'com.smccloud.hotdeath'

        minSdk 34

        targetSdk 36

        // versionCode is the only field Android compares, and it is derived from
        // appVersion at the top of this file rather than typed here. See the
        // note there for the encoding and for why it has to increase.
        versionCode computedVersionCode

        versionName appVersion

        // The instrumented suite still needs a real runtime: MainLaunchTest
        // launches an Activity and inspects live widgets. src/test covers the
        // pure-logic classes instead. Some of those tests are plain JVM; the
        // ones that touch SharedPreferences or R.string go through
        // Robolectric, which gets the merged manifest from here.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Declared only when keystore.properties is there, so an empty signing
    // config never reaches AGP's validation. The CI side of this lives in the
    // Jenkinsfile's Signing material and Signing report stages, and the file
    // itself has to sit directly beside this one -- file('keystore.properties')
    // resolves against this project directory and does not look in
    // subdirectories.
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The release key when there is one, the debug key when there is
            // not. The fallback is the reason the signingConfigs block above is
            // guarded: this project has no release keystore yet, and an unsigned
            // APK cannot be installed, so a clone with no keystore has to produce
            // something installable rather than fail. Everything else about this
            // variant is already a real release build -- minified by R8, no 'g'
            // suffix on the version name.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            versionNameSuffix = 'g'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged AndroidManifest (to resolve
            // GameActivity and its theme) and the compiled resources out of
            // app/build/intermediates. Without this it cannot even build an
            // Activity, so any RobolectricTestRunner test fails here first.
            includeAndroidResources = true
        }
    }
}

// jvmTarget must match compileOptions exactly or the build fails with
// "Inconsistent JVM-target compatibility". Deliberately not using
// jvmToolchain(17): toolchain resolution would hard-fail on a machine with no
// JDK 17 present, and Gradle can only auto-provision it with the foojay
// resolver configured in settings.gradle, which this project does not have.
// Set the target, run on whatever JDK 17+ is available.
//
// kotlinOptions {} is deprecated *with error* as of Kotlin 2.4 and its
// top-level extension is gone, so use the kotlin {} compilerOptions block.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// The app itself is framework-only; everything below is test-only.
// androidTest needs the real device/emulator. src/test runs on the JVM, and
// supplies org.json only via Robolectric's android-all jar -- a plain JVM test
// that calls Card.toJSON() hits the stub in android.jar and throws.
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // 4.15.1 is the newest line that runs on JDK 17 (this module has no
    // toolchain block and targets 17) and it tops out at SDK 35, so
    // src/test/resources/robolectric.properties pins the sandbox to SDK 34.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
}

// Android refuses to install a build whose versionCode is not strictly greater
// than the installed one, and refuses to replace a build signed with a different
// key at the same versionCode. Both failures are invisible until someone tries
// the install, so this checks it before the release APK is built rather than
// after.
//
// The baseline is the highest existing v* tag, not the previous version in the
// git history: a tag is what was actually published. 1.2.145 and 1.2.164 were
// both in the history and neither was ever published, so "the version before
// this one" is not a reliable thing to compare against.
//
// A tag on HEAD is excluded, because that is the release being cut rather than a
// version already published. Without that, tagging v1.4.6 on the commit that
// declares 1.4.6 would make the release commit fail its own check -- 1004006
// against 1004006 -- and the pipeline would go red on the tagged build that is
// supposed to be the good one.
//
// Only a strictly lower versionCode fails. Declaring exactly the published code
// is what every commit between one release and the next looks like, so enforcing
// strict inequality would turn this into a build that is red on main until
// someone remembers to bump -- the sort of gate people learn to route around,
// which is how the versionCode went unchecked in the first place. Equality is
// logged as the warning it is: fine to develop on, not something to publish.
//
// Deliberately not wired into `check`. It reads git, so it needs a checkout that
// has the tags -- a source-archive export and a shallow clone have neither, and
// failing `check` for that would be worse than not checking at all. The
// Jenkinsfile calls it explicitly on the release path, which is the only place
// an out-of-date versionCode can ship.
tasks.register('verifyVersionCode', VerifyVersionCode) {
    group = 'verification'
    description = 'Fails unless versionCode is greater than the highest published v* tag.'
    declaredVersionCode.set(computedVersionCode)
    declaredVersionName.set(appVersion)
    gitWorkingDir.set(rootDir)
}

