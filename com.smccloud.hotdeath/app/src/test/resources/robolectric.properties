# Robolectric picks its SDK from the merged manifest's targetSdk unless told
# otherwise. This module targets SDK 36, which Robolectric 4.15.1 does not
# support yet (4.16 is the first line with Baklava, and it wants JDK 21).
# Pin the sandbox to the minSdk instead so testDebugUnitTest stays runnable on
# JDK 17.
sdk=34