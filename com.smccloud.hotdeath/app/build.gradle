import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Release signing material, read from keystore.properties beside this file when
// it exists. That file is gitignored and holds the four secrets, so nothing
// about the key lives in git. Without it the release variant falls back to the
// debug key, which keeps a fresh clone buildable and keeps CI's release stage
// from failing for anyone who has not set one up.
def keystoreProperties = new Properties()
def keystorePropertiesFile = file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    namespace 'com.smccloud.hotdeath'

    compileSdk 36

    defaultConfig {

        applicationId 'com.smccloud.hotdeath'

        minSdk 34

        targetSdk 36

        // Versioning: MAJOR.MINOR.PATCH, where PATCH is the number of passing
        // tests in the build that produced the artifact. It starts at 1.1.0 and
        // moves by 0.0.1 per passing test, so the patch number is a running count
        // of green tests rather than a hand-maintained sequence -- bumping it is
        // a matter of reading the pass count off the build that just ran.
        //
        // versionCode only ever has to increase, and Android compares nothing
        // else, so it encodes the same three numbers: major*1000000 +
        // minor*1000 + patch. That gives three digits for the minor and three for
        // the patch; when the patch count reaches 1000, bump the minor and start
        // the patch over at 0.
        //
        // 1.1.143 = 116 unit tests plus 27 instrumented, as build #45 ran them,
        // and is the last purely test-derived version.
        //
        // 1.2.0 resets the patch and is the first build carrying the release
        // signing key. The patch counts tests, not releases, so a release that
        // adds no tests -- re-signing a rebuilt artifact, say -- moves the minor
        // instead. Read the patch off the build when it advances; move the minor
        // when it does not. It has to move at all: 1.1.143 was published signed
        // with the debug key, and Android refuses to install a differently
        // signed build over the same versionCode.
        //
        // 1.2.164 = 137 unit tests plus 27 instrumented, as build #59 runs them.
        // Adds HandPlayabilityTest: hasValidCards and Game.checkCard, which
        // needed a real Game, and the isfinal branch that charges the green 3
        // to its owner's virus penalty.
        //
        // 1.3.167 adds GameRoundLoopTest, the three tests that drive startRound and
        // advanceRound to a finish. That is the code the rest of the suite could
        // only reach by poking private fields in: everything from dealHands through
        // finishRound. 140 unit tests plus 27 instrumented, so the patch moves
        // from 164 and the minor stays where stage 4 put it.
        //
        // 1.4.0 converts GameTable to Kotlin. The minor moves rather than the patch
        // because the conversion adds no tests: GameTable is an Android View, and
        // GameRoundLoopTest already constructs one, so there is nothing new for the
        // suite to cover. It is the first of stage 5's six remaining Java files.
        // The count is still 140 unit plus 27 instrumented, which is what 1.3.167
        // already meant -- so this release exists to carry the converted table, not
        // to announce anything the last one did not.
        //
        // 1.4.1 converts GameActivity, the second of stage 5's six. Still 140 plus
        // 27, so the count has not moved and the patch is no longer tracking it:
        // from 1.4.0 the patch is just a release counter within the 1.4 line, and the
        // minor is what records a real change. Saying so here rather than letting
        // the next reader assume 1.4.1 means "one more test than 1.4.0", which it
        // does not. versionCode still has to increase -- Android refuses to install
        // a build over the same one, signed or not.
        versionCode 1004001

        versionName "1.4.1"

        // The instrumented suite still needs a real runtime: MainLaunchTest
        // launches an Activity and inspects live widgets. src/test covers the
        // pure-logic classes instead. Some of those tests are plain JVM; the
        // ones that touch SharedPreferences or R.string go through
        // Robolectric, which gets the merged manifest from here.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Declared only when keystore.properties is there, so an empty signing
    // config never reaches AGP's validation. The CI side of this lives in the
    // Jenkinsfile's Signing material and Signing report stages, and the file
    // itself has to sit directly beside this one -- file('keystore.properties')
    // resolves against this project directory and does not look in
    // subdirectories.
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The release key when there is one, the debug key when there is
            // not. The fallback is the reason the signingConfigs block above is
            // guarded: this project has no release keystore yet, and an unsigned
            // APK cannot be installed, so a clone with no keystore has to produce
            // something installable rather than fail. Everything else about this
            // variant is already a real release build -- minified by R8, no 'g'
            // suffix on the version name.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            versionNameSuffix = 'g'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged AndroidManifest (to resolve
            // GameActivity and its theme) and the compiled resources out of
            // app/build/intermediates. Without this it cannot even build an
            // Activity, so any RobolectricTestRunner test fails here first.
            includeAndroidResources = true
        }
    }
}

// jvmTarget must match compileOptions exactly or the build fails with
// "Inconsistent JVM-target compatibility". Deliberately not using
// jvmToolchain(17): toolchain resolution would hard-fail on a machine with no
// JDK 17 present, and Gradle can only auto-provision it with the foojay
// resolver configured in settings.gradle, which this project does not have.
// Set the target, run on whatever JDK 17+ is available.
//
// kotlinOptions {} is deprecated *with error* as of Kotlin 2.4 and its
// top-level extension is gone, so use the kotlin {} compilerOptions block.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// The app itself is framework-only; everything below is test-only.
// androidTest needs the real device/emulator. src/test runs on the JVM, and
// supplies org.json only via Robolectric's android-all jar -- a plain JVM test
// that calls Card.toJSON() hits the stub in android.jar and throws.
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // 4.15.1 is the newest line that runs on JDK 17 (this module has no
    // toolchain block and targets 17) and it tops out at SDK 35, so
    // src/test/resources/robolectric.properties pins the sandbox to SDK 34.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
}
