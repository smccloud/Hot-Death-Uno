import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    namespace 'com.smccloud.hotdeath'

    compileSdk 36

    defaultConfig {

        applicationId 'com.smccloud.hotdeath'

        minSdk 34

        targetSdk 36

        versionCode 12

        versionName "1.0.12"

        // Instrumented tests run against a real Android runtime, which the
        // JVM unit tests cannot stand in for: org.json is a stub in unit tests
        // (so Penalty's JSON round-trip throws there), and the launch smoke
        // test needs a real Activity.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix = 'g'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// jvmTarget must match compileOptions exactly or the build fails with
// "Inconsistent JVM-target compatibility". Deliberately not using
// jvmToolchain(17): toolchain resolution would hard-fail on a machine with no
// JDK 17 present, and Gradle can only auto-provision it with the foojay
// resolver configured in settings.gradle, which this project does not have.
// Set the target, run on whatever JDK 17+ is available.
//
// kotlinOptions {} is deprecated *with error* as of Kotlin 2.4 and its
// top-level extension is gone, so use the kotlin {} compilerOptions block.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// androidTest only -- the app itself still has no third-party dependencies.
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
