import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {

    namespace 'com.smccloud.hotdeath'

    compileSdk 36

    defaultConfig {

        applicationId 'com.smccloud.hotdeath'

        minSdk 34

        targetSdk 36

        versionCode 12

        versionName "1.0.12"

        // The instrumented suite still needs a real runtime: MainLaunchTest
        // launches an Activity and inspects live widgets. src/test covers the
        // pure-logic classes instead. Some of those tests are plain JVM; the
        // ones that touch SharedPreferences or R.string go through
        // Robolectric, which gets the merged manifest from here.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix = 'g'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged AndroidManifest (to resolve
            // GameActivity and its theme) and the compiled resources out of
            // app/build/intermediates. Without this it cannot even build an
            // Activity, so any RobolectricTestRunner test fails here first.
            includeAndroidResources = true
        }
    }
}

// jvmTarget must match compileOptions exactly or the build fails with
// "Inconsistent JVM-target compatibility". Deliberately not using
// jvmToolchain(17): toolchain resolution would hard-fail on a machine with no
// JDK 17 present, and Gradle can only auto-provision it with the foojay
// resolver configured in settings.gradle, which this project does not have.
// Set the target, run on whatever JDK 17+ is available.
//
// kotlinOptions {} is deprecated *with error* as of Kotlin 2.4 and its
// top-level extension is gone, so use the kotlin {} compilerOptions block.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// The app itself is framework-only; everything below is test-only.
// androidTest needs the real device/emulator. src/test runs on the JVM, and
// supplies org.json only via Robolectric's android-all jar -- a plain JVM test
// that calls Card.toJSON() hits the stub in android.jar and throws.
dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // 4.15.1 is the newest line that runs on JDK 17 (this module has no
    // toolchain block and targets 17) and it tops out at SDK 35, so
    // src/test/resources/robolectric.properties pins the sandbox to SDK 34.
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
}
