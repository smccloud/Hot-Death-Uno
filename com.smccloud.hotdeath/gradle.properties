## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Mon Oct 24 10:57:51 CDT 2022
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
# The app itself is framework-only, but the androidTest sources pull in
# androidx.test, and AGP refuses to resolve an AndroidX dependency without
# this set.
android.useAndroidX=true

# Configuration cache. Gradle's own docs are explicit that its state lives at
# <project>/.gradle/configuration-cache -- in the project directory, NOT in the
# Gradle user home -- which is why the Jenkinsfile's Workspace cleanup stage has
# to carve it out. Without that carve-out this setting would make CI slower and
# not faster: every run would write a fresh entry and never read one back.
#
# Expected to be worth ~3-9% of a full pipeline, and that estimate is the whole
# of the case for it. The 12m38s of build #74 breaks down as 4m02s of unit tests
# (GameRoundLoopTest, which needs LEGACY looper mode so every table redraw
# really executes), ~107s of instrumented tests, ~340s of emulator boot polling,
# and 418s of Gradle across seven invocations. Only the configuration slice of
# that 418s is addressed here, so the ceiling is low by construction.
#
# problems=warn is a migration aid, not a permanent setting: an AGP or R8
# incompatibility degrades to a warning and the build still runs, rather than
# going red. Drop it to the default (fail) once a run has come back clean
# several times over.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
